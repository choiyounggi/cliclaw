# Changesets release automation.
#
# On every push to main, changesets/action checks the .changeset/ directory:
#
#   - If changeset files are pending, it opens/updates a "chore: version
#     packages" PR that runs `npm run version` (-> `changeset version`) to
#     bump package.json, write the changelog, and consume the changesets.
#   - Once that PR is merged (so no changesets remain pending), it runs the
#     `publish` command below and, on success, pushes the resulting git tag
#     and creates a GitHub Release for it (changesets/action's default
#     create-github-releases / push-git-tags behavior), using the workflow's
#     own GITHUB_TOKEN.
#
# This intentionally does NOT run `npm publish` or `changeset publish` here.
# publish.yml already publishes to npm — triggered by `release: [published]`
# — and holds the NPM_TOKEN secret. `npx changeset git-tag` only creates the
# git tag (no npm publish, no token needed); changesets/action then pushes
# that tag and creates the matching GitHub Release, which is exactly the
# event publish.yml listens for. So this workflow versions + tags + releases,
# and publish.yml (unchanged) does the actual npm publish. No new secrets.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Version packages or tag + release
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset git-tag
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
